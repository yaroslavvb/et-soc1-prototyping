<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limits of Observability</title>
<meta name="description" content="What can be observed on the ET-SoC-1 at every granularity, from board power every 130 ms down to a single flip-flop per cycle in the open RTL, what could be made observable, and what stays hidden on silicon.">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --code-bg: #f1f0ec;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c7: #4a3aa7; --ref: #8c8b85;
  --ok: #008300; --warn: #eda100; --bad: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --code-bg: #242422;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c7: #9085e9; --ref: #76756f;
    --ok: #3aa83a; --warn: #c98500; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --code-bg: #242422;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c7: #9085e9; --ref: #76756f;
  --ok: #3aa83a; --warn: #c98500; --bad: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 940px; margin: 0 auto; padding: 28px 16px 72px; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; margin: 44px 0 10px; }
h3 { font-size: 1rem; margin: 22px 0 8px; }
.byline { color: var(--ink-2); font-size: 0.9rem; margin: 0 0 22px; }
.lede { font-size: 1.05rem; }
.small { font-size: 0.85rem; color: var(--ink-2); }
a { color: var(--c1); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.86em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.45; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0 8px; }
.kpi .lab { color: var(--ink-2); font-size: 0.8rem; }
.kpi .val { font-size: 1.5rem; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--ink-2); font-size: 0.8rem; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; }
.chart.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart.scroll svg { min-width: 640px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 0.8rem; line-height: 1.4;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 320px; display: none; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lab { fill: var(--ink-2); font-size: 12px; }
.lab-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; }
td.lvl { font-weight: 600; white-space: nowrap; }
.wide table { min-width: 760px; }
.chip { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  border: 1px solid transparent; }
.chip.works_now { color: var(--ok); border-color: var(--ok); }
.chip.needs_fw_change { color: var(--c1); border-color: var(--c1); }
.chip.needs_tooling { color: var(--warn); border-color: var(--warn); }
.chip.research_only { color: var(--muted); border-color: var(--muted); }
.chip.impossible_on_silicon { color: var(--bad); border-color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); margin: 6px 0 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; }
.controls button { font: inherit; font-size: 0.82rem; background: var(--surface); color: var(--ink-2); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 30px; }
.controls button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.verif { font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.verif.confirmed::before { content: "✓ "; color: var(--ok); }
.verif.disputed::before { content: "± "; color: var(--warn); }
.verif.unverified::before { content: "· "; }
ol li, ul li { margin: 5px 0; }
details { margin: 8px 0; }
summary { cursor: pointer; color: var(--ink-2); font-size: 0.9rem; }
.chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>
<main>

const D = __DATA__;

</script>
</main>
</body>
</html>
