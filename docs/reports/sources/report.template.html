.ck-frame svg :is(rect, circle, polygon, ellipse)[tabindex]:not(.ck-hit):focus-visible,
.ck-frame svg [tabindex]:focus-visible > :is(rect, circle, polygon, ellipse):not(.ck-hit) { stroke: var(--ink); stroke-width: 2px; }
.ck-frame svg :is(rect, circle, polygon, ellipse).ck-active:not(.ck-hit),

.ck-hidden { display: none !important; }
.ck-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 8px 0 6px; }
.ck-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 6px 0 8px; font-size: 0.82rem; color: var(--ink-2); }
.ck-legend .ck-li { display: inline-flex; align-items: center; gap: 6px; }

  border-radius: 999px; padding: 3px 10px; min-height: 32px; cursor: pointer; }
.ck-legend button.ck-li[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
.ck-legend svg { flex: none; overflow: visible; }
.ck-seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.82rem; }
.ck-seg-label { color: var(--ink-2); }
.ck-seg-group { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.ck-seg [role="radio"] { font: inherit; background: var(--surface); color: var(--ink-2); border: 1px solid var(--border, var(--grid));
  border-radius: 999px; padding: 4px 12px; min-height: 32px; cursor: pointer; }
.ck-seg [role="radio"][aria-checked="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.ck-range { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.82rem; color: var(--ink-2); }
.ck-range input[type="range"] { flex: 0 1 200px; width: 200px; min-width: 120px; min-height: 32px; margin: 0; accent-color: var(--c1); }
.ck-range output { flex: none; min-width: 3em; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.ck-legend button:focus-visible, .ck-seg [role="radio"]:focus-visible, .ck-range input:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
/* Hyphenate cells (html lang="en-GB"). Not overflow-wrap:anywhere: in auto-layout tables it lets a column shrink to one

<script>
/* Section anchors. Every h2/h3 gets an id (its own, or one made from its text) and a # link; clicking a heading
   or a table-of-contents link puts #id in the URL. When the page is framed by spacesheep.dev the fragment is
   mirrored into the outer, shareable URL (postMessage ss-hash), and an outer #fragment is forwarded in on load. */
(function () {
  const slug = t => t.toLowerCase().replace(/^\d+(\.\d+)*\.?\s*/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  const post = h => { if (window.parent !== window) { try { window.parent.postMessage({type: 'ss-hash', hash: h}, '*'); } catch (_) {} } };
  const go = id => { try { history.replaceState(null, '', location.pathname + location.search + '#' + id); } catch (_) {}
    const el = document.getElementById(id); if (el) el.scrollIntoView({block: 'start'}); post('#' + id); };
  const seen = new Set();
  document.querySelectorAll('main h2, main h3').forEach(h => {
    if (!h.id) { let id = slug(h.textContent) || 'section', n = 2; while (seen.has(id) || document.getElementById(id)) id = slug(h.textContent) + '-' + n++; h.id = id; }
    seen.add(h.id);
    const a = document.createElement('a'); a.href = '#' + h.id; a.className = 'hlink'; a.textContent = '#'; a.title = 'link to this section'; h.appendChild(a);
    h.style.cursor = 'pointer';
    h.addEventListener('click', ev => { if (ev.target.tagName === 'A' && ev.target !== a) return; ev.preventDefault(); go(h.id); });
  });
  window.addEventListener('hashchange', () => post(location.hash));
  if (location.hash) { post(location.hash); const el = document.getElementById(location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({block: 'start'}), 50); }
})();
</script>
<script>
/* Contents list, link back to the reports hub, and repository paths as links. Runs after the section-anchor
   script above, whose h2 ids the contents list links to. Pages not built from this template paste both blocks
   before </main>.
   - Contents: a page with 6 or more h2s and no #toclist of its own gets a numbered list before its first h2.
   - Footer: every page but the hub ends with a link to the hub's list of reports, unless it already has one.
   - Paths: an inline <code> whose whole text is a repository path (docs/…, workloads/…, tools/…, scripts/…,
     kernels/…, rtl-sim/…) becomes a GitHub link. Code blocks, code already in a link and globs stay as they are. */
(function () {
  const main = document.querySelector('main'); if (!main) return;
  const HUB = 'https://spacesheep.dev/@yaroslavvb/et-soc1-limits-of-observability';
  const BACK = '← All ET-SoC-1 measurement reports';
  const REPO = 'https://github.com/yaroslavvb/et-soc1-prototyping/tree/main/';
  const text = el => { const c = el.cloneNode(true); c.querySelectorAll('.hlink').forEach(a => a.remove()); return c.textContent.replace(/\s+/g, ' ').trim(); };
  const NUM = /^(?:§\s*\d+(?:\.\d+)*\.?|\d+(?:\.\d+)*\.|\d+(?:\.\d+)+)\s+/;  /* "3. ", "4.2 ", "§5 "; not "600 MHz" */

  const h2s = [...main.querySelectorAll('h2')];
  if (h2s.length >= 6 && !document.getElementById('toclist')) {
    const nav = document.createElement('nav'); nav.className = 'card';
    const b = document.createElement('b'); b.textContent = 'Contents';
    const ol = document.createElement('ol'); ol.id = 'toclist';
    h2s.forEach(h => {
      if (!h.id) return;
      const t = text(h), m = t.match(/^§?\s*(\d+)[.\s]/), li = document.createElement('li'), a = document.createElement('a');
      if (m && NUM.test(t)) li.value = +m[1];
      a.href = '#' + h.id; a.textContent = t.replace(NUM, '') || t;
      li.appendChild(a); ol.appendChild(li);
    });
    nav.append(b, ol);
    h2s[0].parentNode.insertBefore(nav, h2s[0]);
  }

  const h1 = main.querySelector('h1');
  const isHub = !!h1 && /^limits of observability/i.test(text(h1));
  const hasBack = [...document.querySelectorAll('a')].some(a => a.textContent.replace(/\s+/g, ' ').trim() === BACK);
  if (!isHub && !hasBack) {
    const p = document.createElement('p'); p.className = 'small';
    const a = document.createElement('a'); a.href = HUB + '#reports'; a.textContent = BACK;
    p.appendChild(a); main.appendChild(p);
  }

  const PATH = /^(docs|workloads|tools|scripts|kernels|rtl-sim)\/[\w./-]+$/;
  main.querySelectorAll('code').forEach(c => {
    if (c.closest('pre, a')) return;
    const t = c.textContent.trim(); if (!PATH.test(t)) return;
    const a = document.createElement('a'); a.href = REPO + t;
    c.parentNode.insertBefore(a, c); a.appendChild(c);
  });
})();
</script>
