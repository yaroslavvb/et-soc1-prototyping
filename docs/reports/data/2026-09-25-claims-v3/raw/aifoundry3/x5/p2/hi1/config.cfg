# V3-X5 configuration x5.cfg (PLAN3 §2 V3-X5): fp32 zeros, ones, uniform, randn and fp16 randn (the EM4
# temperature-arm pattern) on all 1,024 minions. run_ablation adds --seconds and --seed (block + 1 + SEED_OFFSET).
fp32_zeros      --test fma --type fp32 --pattern none --values zeros --shires 0xffffffff --per-shire 32
fp32_ones       --test fma --type fp32 --pattern none --values ones --shires 0xffffffff --per-shire 32
fp32_uniform    --test fma --type fp32 --pattern none --values uniform --shires 0xffffffff --per-shire 32
fp32_randn      --test fma --type fp32 --pattern none --values randn --shires 0xffffffff --per-shire 32
fp16_randn      --test fma --type fp16 --pattern none --values randn --shires 0xffffffff --per-shire 32
