# V3-ABL-B configuration v3-energy.cfg (PLAN3 §2 V3-ABL-B): the 11 CONFIGS of workloads/sparsity/run_energy.py
# (spin, fma-*, gemv-*; their arguments copied unchanged), gemv-dense-0 (the plain kernel on dense x), and the six
# E2 lines (int8 ones/randn and fp16 randn, operands in L1 vs B streamed through TenB with --b-stream).
# The plan says "12 run_energy.py CONFIGS" but lists, and run_energy.py has, 11; with gemv-dense-0 and E2's 6: 18.
# run_ablation adds --seconds and --seed (block + 1). fma-* use the host's default small-integer operands.
spin            --test spin --shires 0xFFFFFFFF --per-shire 32
fma-dense       --test fma --type fp32 --pattern elem --sweep 0 --shires 0xFFFFFFFF --per-shire 32
fma-50          --test fma --type fp32 --pattern elem --sweep 0.5 --shires 0xFFFFFFFF --per-shire 32
fma-875         --test fma --type fp32 --pattern elem --sweep 0.875 --shires 0xFFFFFFFF --per-shire 32
fma-zero        --test fma --type fp32 --pattern elem --sweep 1 --shires 0xFFFFFFFF --per-shire 32
fma-col50       --test fma --type fp32 --pattern col --sweep 0.5 --shires 0xFFFFFFFF --per-shire 32
fma-rowmask     --test fma --type fp32 --pattern none --sweep 0 --row-mask 0x00FF --shires 0xFFFFFFFF --per-shire 32
gemv-dense-90   --test gemv --gemv dense --sweep 0.9 --shires 0xFFFFFFFF --per-shire 32
gemv-skip-0     --test gemv --gemv skip --sweep 0 --shires 0xFFFFFFFF --per-shire 32
gemv-skip-90    --test gemv --gemv skip --sweep 0.9 --shires 0xFFFFFFFF --per-shire 32
gemv-skip-99    --test gemv --gemv skip --sweep 0.99 --shires 0xFFFFFFFF --per-shire 32
gemv-dense-0    --test gemv --gemv dense --sweep 0 --shires 0xffffffff --per-shire 32
int8_ones_l1    --test fma --type int8 --pattern none --values ones --shires 0xffffffff --per-shire 32
int8_ones_tenb  --test fma --type int8 --pattern none --values ones --b-stream --shires 0xffffffff --per-shire 32
int8_randn_l1   --test fma --type int8 --pattern none --values randn --shires 0xffffffff --per-shire 32
int8_randn_tenb --test fma --type int8 --pattern none --values randn --b-stream --shires 0xffffffff --per-shire 32
fp16_randn_l1   --test fma --type fp16 --pattern none --values randn --shires 0xffffffff --per-shire 32
fp16_randn_tenb --test fma --type fp16 --pattern none --values randn --b-stream --shires 0xffffffff --per-shire 32
