<line x1="312.3" y1="246" x2="312.3" y2="266" class="base" stroke-width="2"><title>F1 24.8%</title></line>
<line x1="316.8" y1="272" x2="316.8" y2="292" class="base" stroke-width="2"><title>F1 25.5%</title></line>
<line x1="304.2" y1="298" x2="304.2" y2="318" class="base" stroke-width="2"><title>F1 23.6%</title></line>
<text x="16.0" y="363.0" class="t3 muted" text-anchor="start" >Under 3 W, scored in watts: the 7 subset points of 1, 4 or 8</text>
<text x="16.0" y="378.0" class="t3 muted" text-anchor="start" >shires read -0.05 to +0.39 W off. Source: arm B's data</text>
<text x="16.0" y="393.0" class="t3 muted" text-anchor="start" >(79340bfa) and frozen forecasts (d3f031d1; F1: eb2f7ac2),</text>
<text x="16.0" y="408.0" class="t3 muted" text-anchor="start" >this folder's script on the footing of arm B's dated note 1</text>
<text x="16.0" y="423.0" class="t3 muted" text-anchor="start" >(f155c8ca); post hoc classes.</text>
