<title id="t">The simulator has no clock; the card's extra time is the memory path</title>
<desc id="d">On 265 blind GEMM points the card took 8-34 times the simulator's step count (median 24); the tensor unit's own op filled 17-99% of each op (median 39%; 21-101%, median 40%, on the registered floor).</desc>
