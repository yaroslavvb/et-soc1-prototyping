<text x="16.0" y="469.0" class="t3 muted" text-anchor="start" >Points: E206 arms A and B, E207 (law arms without a step</text>
<text x="16.0" y="484.0" class="t3 muted" text-anchor="start" >count left out of the top panel). The step counts come from</text>
<text x="16.0" y="499.0" class="t3 muted" text-anchor="start" >a law fitted to 11 simulator runs (post hoc, registered in</text>
<text x="16.0" y="514.0" class="t3 muted" text-anchor="start" >E206 before its data). The TenB floor is a post hoc closed</text>
<text x="16.0" y="529.0" class="t3 muted" text-anchor="start" >form from E101's loop on the card, not the RTL bench.</text>
