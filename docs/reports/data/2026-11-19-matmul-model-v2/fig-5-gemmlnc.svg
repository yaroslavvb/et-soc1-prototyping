<text x="16.0" y="46.0" class="t1 ink" text-anchor="start">E213 and 1.14-1.52x MM1-v3.1's on E215; the</text>
<text x="16.0" y="66.0" class="t1 ink" text-anchor="start">frozen term read 0.88-1.01x</text>
