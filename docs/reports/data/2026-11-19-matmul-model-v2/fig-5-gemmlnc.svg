<text x="16.0" y="103.0" class="t3 ink2" text-anchor="start">seconds (blind). E213: MM1-v3 at gemmLnc (accent) and its</text>
<text x="16.0" y="119.0" class="t3 ink2" text-anchor="start">gemmL twin (grey). E215: MM1-v3.1 (accent) and MM1-v3.1 +</text>
<text x="16.0" y="135.0" class="t3 ink2" text-anchor="start">the gemmLnc term (open).</text>
