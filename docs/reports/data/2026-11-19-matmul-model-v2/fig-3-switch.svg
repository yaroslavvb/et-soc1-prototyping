<svg xmlns="http://www.w3.org/2000/svg" width="400" height="747" viewBox="0 0 400 747" role="img" aria-labelledby="t d" style="max-width:100%;height:auto">
<title id="t">Energy followed the counted switches: 1.9% of D blind and 5.7% unread, against 16-47% and 22%; on E215's 12 new kinds, int8 data of plus and minus one missed</title>
<desc id="d">Horizontal bars: each route's rms error in the data-dependent power as a share of D (random minus zeros), on E210's 13 blind test cases and on the unread test's 29 cases. The switch route is the accent bar. Below, a scatter of E215's family S kinds (blind, post hoc-selected): each kind's W over idle over its random partner's, measured against MM1-v3.1's forecast, fp32 as circles and int8 as squares; the diagonal is an exact forecast, and the one kind far from it is int8 data of plus and minus one.</desc>
<style>
  .bg{fill:#ffffff} .ink{fill:#1d1d1b} .ink2{fill:#52514e} .muted{fill:#6f6e69}
  .grid{stroke:#e1e0d9;stroke-width:1} .base{stroke:#c3c2b7;stroke-width:1}
  .acc{fill:#2a78d6} .accs{stroke:#2a78d6;stroke-width:2} .gry{fill:#898781} .gry2{fill:#52514e} .hol{fill:#ffffff;stroke:#2a78d6;stroke-width:2}
  .holg{fill:#ffffff;stroke:#898781;stroke-width:2} .band{fill:#2a78d6;fill-opacity:0.10} .bandg{fill:#898781;fill-opacity:0.12}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .t1{font-size:16px;font-weight:600} .t2{font-size:13px} .t3{font-size:12.5px} .tn{font-size:12px;font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .muted{fill:#a9a8a0}
    .grid{stroke:#2c2c2a} .base{stroke:#383835}
    .acc{fill:#3987e5} .accs{stroke:#3987e5} .gry{fill:#898781} .gry2{fill:#c3c2b7} .hol{fill:#1a1a19;stroke:#3987e5}
    .holg{fill:#1a1a19;stroke:#898781} .band{fill:#3987e5} .bandg{fill:#898781}
  }
</style>
