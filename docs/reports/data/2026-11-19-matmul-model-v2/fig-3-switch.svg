<text x="16.0" y="107.0" class="t3 ink2" text-anchor="start">rms error of the data-dependent power, % of D (random minus</text>
<text x="16.0" y="123.0" class="t3 ink2" text-anchor="start">zeros). E210: blind, nine patterns at two shapes; unread:</text>
<text x="16.0" y="139.0" class="t3 ink2" text-anchor="start">new switch counts for E212's plan tiles and the real tiles.</text>
