<svg xmlns="http://www.w3.org/2000/svg" width="400" height="361" viewBox="0 0 400 361" role="img" aria-labelledby="t d" style="max-width:100%;height:auto">
<title id="t">Energy followed the counted switches: 1.9% of D blind and 5.7% unread, against 16-47% and 22%</title>
<desc id="d">Horizontal bars: each route's rms error in the data-dependent power as a share of D (random minus zeros), on E210's 13 blind test cases and on the unread test's 29 cases. The switch route is the accent bar.</desc>
<style>
  .bg{fill:#ffffff} .ink{fill:#1d1d1b} .ink2{fill:#52514e} .muted{fill:#6f6e69}
  .grid{stroke:#e1e0d9;stroke-width:1} .base{stroke:#c3c2b7;stroke-width:1}
  .acc{fill:#2a78d6} .accs{stroke:#2a78d6;stroke-width:2} .gry{fill:#898781} .gry2{fill:#52514e} .hol{fill:#ffffff;stroke:#2a78d6;stroke-width:2}
  .holg{fill:#ffffff;stroke:#898781;stroke-width:2} .band{fill:#2a78d6;fill-opacity:0.10} .bandg{fill:#898781;fill-opacity:0.12}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .t1{font-size:16px;font-weight:600} .t2{font-size:13px} .t3{font-size:12.5px} .tn{font-size:12px;font-variant-numeric:tabular-nums}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .muted{fill:#a9a8a0}
    .grid{stroke:#2c2c2a} .base{stroke:#383835}
    .acc{fill:#3987e5} .accs{stroke:#3987e5} .gry{fill:#898781} .gry2{fill:#c3c2b7} .hol{fill:#1a1a19;stroke:#3987e5}
    .holg{fill:#1a1a19;stroke:#898781} .band{fill:#3987e5} .bandg{fill:#898781}
  }
</style>
<rect class="bg" x="0" y="0" width="400" height="361"/>
<text x="16.0" y="26.0" class="t1 ink" text-anchor="start">Energy followed the counted switches: 1.9% of</text>
<text x="16.0" y="46.0" class="t1 ink" text-anchor="start">D blind and 5.7% unread, against 16-47% and</text>
<text x="16.0" y="66.0" class="t1 ink" text-anchor="start">22%</text>
<text x="16.0" y="87.0" class="t3 ink2" text-anchor="start">rms error of the data-dependent power, % of D (random minus</text>
<text x="16.0" y="103.0" class="t3 ink2" text-anchor="start">zeros). E210: blind, nine patterns at two shapes; unread:</text>
<text x="16.0" y="119.0" class="t3 ink2" text-anchor="start">new switch counts for E212's plan tiles and the real tiles.</text>
<text x="16.0" y="159.0" class="t3 ink2" text-anchor="start">E210, blind (13 test cases)</text>
<text x="16.0" y="180.0" class="t3 ink" text-anchor="start">switch route (R1)</text>
<rect class="acc" x="170" y="169" width="7.1" height="14" rx="2"><title>E210, blind (13 test cases): switch route (R1) 1.87% of D</title></rect>
<text x="182.1" y="180.5" class="tn ink" text-anchor="start">1.9%</text>
<text x="16.0" y="202.0" class="t3 ink" text-anchor="start">bit flips, scaled (R3L)</text>
<rect class="gry" x="170" y="191" width="61.5" height="14" rx="2"><title>E210, blind (13 test cases): bit flips, scaled (R3L) 16.19% of D</title></rect>
<text x="236.5" y="202.5" class="tn ink" text-anchor="start">16.2%</text>
<text x="16.0" y="224.0" class="t3 ink" text-anchor="start">nearest kind (R4)</text>
<rect class="gry" x="170" y="213" width="74.9" height="14" rx="2"><title>E210, blind (13 test cases): nearest kind (R4) 19.71% of D</title></rect>
<text x="249.9" y="224.5" class="tn ink" text-anchor="start">19.7%</text>
<text x="16.0" y="246.0" class="t3 ink" text-anchor="start">MM1-v1 kind term (R2, 5)</text>
<rect class="gry" x="170" y="235" width="80.6" height="14" rx="2"><title>E210, blind (13 test cases): MM1-v1 kind term (R2, 5) 21.22% of D</title></rect>
<text x="255.6" y="246.5" class="tn ink" text-anchor="start">21.2%</text>
<text x="16.0" y="268.0" class="t3 ink" text-anchor="start">bit flips, raw (R3)</text>
<rect class="gry" x="170" y="257" width="180.4" height="14" rx="2"><title>E210, blind (13 test cases): bit flips, raw (R3) 47.48% of D</title></rect>
<text x="355.4" y="268.5" class="tn ink" text-anchor="start">47.5%</text>
<text x="16.0" y="295.0" class="t3 ink2" text-anchor="start">Unread tiles (29 cases)</text>
<text x="16.0" y="316.0" class="t3 ink" text-anchor="start">MM1-v3 + new counts</text>
<rect class="acc" x="170" y="305" width="21.6" height="14" rx="2"><title>Unread tiles (29 cases): MM1-v3 + new counts 5.70% of D</title></rect>
<text x="196.6" y="316.5" class="tn ink" text-anchor="start">5.7%</text>
<text x="16.0" y="338.0" class="t3 ink" text-anchor="start">null N</text>
<rect class="gry" x="170" y="327" width="82.2" height="14" rx="2"><title>Unread tiles (29 cases): null N 21.64% of D</title></rect>
<text x="257.2" y="338.5" class="tn ink" text-anchor="start">21.6%</text>
<line class="base" x1="170" x2="170" y1="153" y2="347"/>
</svg>
