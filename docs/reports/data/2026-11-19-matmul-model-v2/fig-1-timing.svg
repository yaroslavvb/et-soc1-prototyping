<text x="16.0" y="67.0" class="t3 ink2" text-anchor="start">Card cycles per simulated instruction, 451 blind points of</text>
<text x="16.0" y="83.0" class="t3 ink2" text-anchor="start">rgm136's gemmL (E206, E207, E213 and E215); median 24.0. The</text>
<text x="16.0" y="99.0" class="t3 ink2" text-anchor="start">instruction counts come from a law fitted to 11 simulator</text>
<text x="16.0" y="115.0" class="t3 ink2" text-anchor="start">runs.</text>
