<svg xmlns="http://www.w3.org/2000/svg" width="400" height="565" viewBox="0 0 400 565" role="img" aria-labelledby="t d" style="max-width:100%;height:auto">
<title id="t">Frozen before each blind test, the newest MM1 read 2.7-9.0% in wall cycles</title>
<desc id="d">Two panels, log scale 1% to 100%: the rms error of the newest MM1 frozen before each test (filled circle) against the lab's earlier routes and the previous MM1 (grey), in wall cycles an op and in J over idle given the measured seconds (3 W and above). The shaded band is the card's own session repeat.</desc>
